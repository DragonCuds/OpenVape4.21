name: Build Windows exe

on:
  push:
    branches: [targetfilter-fix]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build full injection bundle (jar + DLL + exe via MSVC)
        shell: cmd
        run: .\gradlew.bat prepareInjectionBundle --no-daemon -PnativeJavaHome=%JAVA_HOME%
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: Vape-injection-bundle
          path: build/injection/
